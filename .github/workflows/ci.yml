name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install and build the adapter
        run: |
          npm install
          npm run build

      - name: Install the fixture against the built adapter
        working-directory: test/fixture
        run: |
          npm install
          npm install ../..

      - name: Smoke test
        run: npm test
