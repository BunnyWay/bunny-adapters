name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Both package.json files ask for Node 20 or later, so both ends of
    # that promise get tested.
    name: Types, format, unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: npm run format:check
      - run: npm run test --workspaces --if-present
      - run: npm run lint:package

  e2e:
    name: End to end on Deno
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: npm ci
      - run: npm run build

      # Builds the showcase, serves dist/client from a local Storage
      # emulator, runs the bundle on Deno, and asserts every route.
      # No bunny.net credential is needed.
      - run: node tests/e2e.mjs

      # One small Astro project per configuration: a base path, a build
      # format, redirects, islands, actions, and the rest. Each one builds,
      # runs on Deno behind the same emulator, and is asserted.
      - run: node --test --test-concurrency=4 tests/suites/*.test.mjs
